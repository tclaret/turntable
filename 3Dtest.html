<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turntable 3D Redesign - Sélecteur Agrandit</title>
    <style>
        /* CSS Général */
        body {
            background-color: #f0f0f0; 
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden; 
            font-family: Arial, sans-serif;
        }

        /* 1. Interface de Contrôles (2D - Fixe en haut) */
        .interface-controls {
            width: 100%;
            background-color: #333; 
            color: white;
            padding: 10px 0; 
            display: flex;
            flex-direction: column; 
            align-items: center;
            position: fixed; 
            top: 0;
            z-index: 100; 
        }

        /* Styles des contrôles (inchangés) */
        .controls-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; 
            padding: 5px 0; 
        }

        .control-btn {
            cursor: pointer;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            background-color: #777;
            color: white;
            transition: background-color 0.2s;
        }
        .control-btn.active { background-color: #c0392b; }
        .control-btn:hover { background-color: #999; }

        .pitch-group { display: flex; align-items: center; gap: 5px; color: #ccc; }
        .pitch-slider {
            -webkit-appearance: none; width: 100px; height: 10px;
            background: #999; outline: none; border-radius: 5px; padding: 0; 
        }
        .pitch-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px;
            background: #2c3e50; border-radius: 50%; cursor: pointer;
        }

        /* 2. Scène 3D */
        .scene {
            perspective: 500px; 
            width: 80vw; 
            height: 80vh; 
            position: relative;
            margin-top: 100px; 
        }

        /* 3. Corps de la platine (incliné à 70°) */
        .turntable-base {
            width: 90vw; 
            height: 10vw; 
            background-color: #555; 
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            position: absolute;
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%) translateY(3vw) rotateX(70deg); 
            transform-origin: bottom center; 
        }

        /* 4. SÉLECTEUR DE VITESSE (Chicken Head) */
        .speed-selector-container {
            position: absolute;
            top: 1.5vw; 
            left: 5vw; /* MODIFIÉ : Décalé plus à gauche (était 10vw) */
            z-index: 10;
            transform: rotateX(-70deg); 
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .selector-label {
            position: absolute;
            top: -15px; 
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8vw; /* MODIFIÉ : Agrandit de 20% (était 1.5vw) */
            color: #eee;
            width: 150%;
            text-align: center;
        }
        
        .selector-base {
            width: 9.6vw; /* MODIFIÉ : Agrandit de 20% (était 8vw) */
            height: 9.6vw; /* MODIFIÉ : Agrandit de 20% (était 8vw) */
            background-image: url('https://tclaret.github.io/turntable/img/ChickenHead.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5) inset;
        }

        .selector-knob {
            width: 4.8vw; /* MODIFIÉ : Agrandit de 20% (était 4vw) */
            height: 4.8vw; /* MODIFIÉ : Agrandit de 20% (était 4vw) */
            background-color: #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
            
            transition: transform 0.3s ease-in-out;
        }

        .selector-knob::before {
            content: '';
            position: absolute;
            width: 1.8vw; /* MODIFIÉ : Agrandit de 20% (était 1.5vw) */
            height: 0.6vw; /* MODIFIÉ : Agrandit de 20% (était 0.5vw) */
            background-color: #c0392b; 
            top: 0.5vw;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 1px;
        }
        
        /* 5. Disque Vinyle (inchangé) */
        .record-container {
            width: 75vw; height: 75vw; 
            position: absolute; top: 60%; left: 50%;
            transform: translate(-50%, -50%) rotateX(70deg); 
            transform-style: preserve-3d; transform-origin: center center; 
            background-color: #888; border-radius: 50%; 
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4); 
        }
        
        /* ... (platter, vinyl-record, after, keyframes - styles inchangés) ... */
        .platter {
            width: 90%; height: 90%; background-color: #444; border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .vinyl-record {
            width: 90%; height: 90%; border-radius: 50%;
            background-image: url('https://tclaret.github.io/turntable/img/DISC.png');
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            border: 0.5vw solid #0a0a0a; box-shadow: 0 0 15px rgba(0, 0, 0, 0.7); 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            animation: spin 3s linear infinite running; transform-origin: center center;
        }

        .vinyl-record::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 1.5vw; height: 1.5vw;
            border-radius: 50%; background-color: #000; z-index: 2; 
        }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateZ(360deg); }
        }
        @keyframes spin-reverse { 
            from { transform: translate(-50%, -50%) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateZ(-360deg); }
        }
    </style>
</head>
<body>

    <div class="interface-controls">
        <div class="controls-line">
            <button id="set33-btn" class="control-btn">SET 33 RPM</button>
            <button id="setstop-btn" class="control-btn active">SET STOP</button>
            <button id="set45-btn" class="control-btn">SET 45 RPM</button>
        </div>
        
        <div class="controls-line">
            <button id="direction-btn" class="control-btn">Direction</button>
            <div class="pitch-group">
                <span>Pitch:</span>
                <input type="range" id="pitch-slider" class="pitch-slider" min="0.5" max="1.5" step="0.01" value="1.0">
            </div>
        </div>
    </div>

    <div class="scene">
        <div class="turntable-base">
            <div class="speed-selector-container">
                <div class="selector-label">33 — STOP — 45</div>
                <div class="selector-base">
                    <div id="speed-knob" class="selector-knob"></div>
                </div>
            </div>
        </div>
        <div class="record-container">
            <div class="platter"></div>
            <div class="vinyl-record"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const vinyl = document.querySelector('.vinyl-record');
            const knob = document.getElementById('speed-knob');
            const set33Btn = document.getElementById('set33-btn');
            const setStopBtn = document.getElementById('setstop-btn');
            const set45Btn = document.getElementById('set45-btn');
            const directionBtn = document.getElementById('direction-btn');
            const pitchSlider = document.getElementById('pitch-slider');
            
            let isRunning = false;
            let currentSpeed = 0; 
            let isReversed = false;

            function updateAnimation() {
                const pitchFactor = parseFloat(pitchSlider.value);
                const animationDuration = currentSpeed === 0 ? 1000 : (currentSpeed / pitchFactor).toFixed(2); 

                vinyl.style.animationName = isReversed ? 'spin-reverse' : 'spin';
                vinyl.style.animationDuration = `${animationDuration}s`;
                vinyl.style.animationPlayState = isRunning ? 'running' : 'paused';
            }

            function setSpeedAndKnob(speed, rpm, button) {
                [set33Btn, setStopBtn, set45Btn].forEach(btn => btn.classList.remove('active'));

                let knobRotation = 0;
                
                if (rpm === 33) {
                    currentSpeed = 3;
                    isRunning = true;
                    knobRotation = -30; 
                } else if (rpm === 45) {
                    currentSpeed = 2.2;
                    isRunning = true;
                    knobRotation = 30; 
                } else { // STOP
                    currentSpeed = 0;
                    isRunning = false;
                    knobRotation = 0; 
                }
                
                knob.style.transform = `translate(-50%, -50%) rotateZ(${knobRotation}deg)`;

                button.classList.add('active');
                
                updateAnimation();
            }

            set33Btn.addEventListener('click', () => setSpeedAndKnob(3, 33, set33Btn));
            setStopBtn.addEventListener('click', () => setSpeedAndKnob(0, 'stop', setStopBtn));
            set45Btn.addEventListener('click', () => setSpeedAndKnob(2.2, 45, set45Btn));

            pitchSlider.addEventListener('input', () => {
                if (isRunning) {
                    updateAnimation();
                }
            });

            directionBtn.addEventListener('click', () => {
                isReversed = !isReversed;
                directionBtn.classList.toggle('active', isReversed);
                updateAnimation();
            });

            setSpeedAndKnob(0, 'stop', setStopBtn);
        });
    </script>
</body>
</html>
